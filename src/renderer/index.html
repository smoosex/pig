<!doctype html>
<html lang="en" class="dark" data-palette="pig" data-surface-style="solid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig</title>
    <script>
      (function () {
        var t = JSON.parse(localStorage.getItem('pig.theme') ?? '{}')
        var a = t.appearance === 'light' || t.appearance === 'dark' ? t.appearance : 'system'
        var dark =
          a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.palette = dark
          ? t.darkTheme === 'everforest'
            ? 'everforest'
            : 'pig'
          : t.lightTheme === 'everforest'
            ? 'everforest'
            : 'pig'
        document.documentElement.dataset.surfaceStyle = window.api.supportsGlass && t.surfaceStyle !== 'solid' ? 'glass' : 'solid'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        // Mirrors lib/locale.ts: the last resolved locale, so a switch survives the next launch.
        var locale = localStorage.getItem('pig.locale') === 'zh-CN' ? 'zh-CN' : 'en'
        document.documentElement.lang = locale
        document.documentElement.dataset.locale = locale
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
