appId: dev.pig.desktop
productName: Pig
publish: null
electronLanguages:
  - en
  - en-US
  - zh-CN
  - zh_CN
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
  - from: node_modules/@earendil-works/pi-coding-agent
    to: node_modules/@earendil-works/pi-coding-agent
    filter:
      - README.md
      - docs/**/*.md
      - examples/**/*
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: src/main/plugins/pig-ui.ts
    to: system-plugins/pig-ui.ts
  - from: src/main/plugins/pig-subagent-host.ts
    to: system-plugins/pig-subagent-host.ts
  - from: src/main/plugins/pig-subagent
    to: system-plugins/pig-subagent
    filter:
      - '**/*.ts'
  - from: src/main/plugins/pig-browser-host.ts
    to: system-plugins/pig-browser-host.ts
  - from: src/main/plugins/pig-browser
    to: system-plugins/pig-browser
    filter:
      - '**/*.ts'
  - from: src/main/plugins/pig-terminal-host.ts
    to: system-plugins/pig-terminal-host.ts
  - from: src/main/plugins/pig-terminal
    to: system-plugins/pig-terminal
    filter:
      - '**/*.ts'
  - from: src/main/plugins/observational-memory
    to: system-plugins/observational-memory
    filter:
      - '**/*.ts'
      - LICENSE
  - from: src/main/plugins/pi-review
    to: system-plugins/pi-review
    filter:
      - '**/*.ts'
      - LICENSE
  - from: out/system-plugins/pi-web-access
    to: system-plugins/pi-web-access
    filter:
      - index.js
      - LICENSE
asarUnpack:
  - resources/**
  # The PTY host loads node-pty's native module and execs its spawn-helper from disk.
  - node_modules/node-pty/**
win:
  icon: build/icon.ico
  executableName: Pig
mac:
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.developer-tools
  identity: pig
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Development
npmRebuild: false
