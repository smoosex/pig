appId: dev.pig.desktop
productName: Pig
publish: null
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
  - '!{.env,.env.*}'
  - '!{bun.lock,bun.lockb}'
asarUnpack:
  - resources/**
win:
  executableName: Pig
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Development
npmRebuild: false
