appId: dev.pig.desktop
productName: Pig
publish: null
electronLanguages:
  - en
  - en-US
  - zh-CN
  - zh_CN
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
  - from: node_modules/@earendil-works/pi-coding-agent
    to: node_modules/@earendil-works/pi-coding-agent
    filter:
      - README.md
      - docs/**/*.md
      - examples/**/*
extraResources:
  - from: src/main/plugins/observational-memory
    to: system-plugins/observational-memory
    filter:
      - '**/*.ts'
      - LICENSE
asarUnpack:
  - resources/**
win:
  executableName: Pig
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  identity: null
afterPack: scripts/sign-mac-local.cjs
linux:
  target:
    - AppImage
    - deb
  category: Development
npmRebuild: false
